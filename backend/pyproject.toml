[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diploma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.136.1",
    "google>=3.0.0",
    "google-genai>=1.75.0",
    "google-generativeai>=0.8.6",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "openai>=2.34.0",
    "pandas>=3.0.2",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
py-modules = [
    "config",
    "database",
    "features",
    "main",
    "roadmap",
    "schemas",
    "skills_taxonomy",
    "top_profession",
]

[tool.setuptools.packages.find]
include = ["services", "services.*", "utils", "utils.*"]
exclude = ["tests", "tests.*"]
